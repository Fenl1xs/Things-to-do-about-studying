<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учебный планер | 17 недель</title>
  <style>
    :root {
      --bg: #0b1329;
      --sidebar: #070d1e;
      --card: #152238;
      --card-inner: #0d1726;
      --border: #233554;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --todo: #ef4444;
      --in-prog: #f59e0b;
      --done: #22c55e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    aside {
      width: 250px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      position: sticky;
      top: 0;
    }
    aside h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 12px;
      padding-left: 8px;
    }
    .weeks-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .week-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .week-btn:hover {
      background: var(--card);
      color: var(--text);
    }
    .week-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 8px;
      border-radius: 12px;
    }
    .btn-action {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
    }
    .btn-action:hover {
      color: var(--text);
      background: #334155;
    }
    main {
      flex: 1;
      padding: 32px 40px;
      max-width: 950px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }
    .status-msg {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .task-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 140px 180px 1fr auto;
      gap: 10px;
    }
    .form-subrow {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      font-size: 0.92rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    input, select {
      background: var(--card-inner);
      color: var(--text);
      padding: 9px 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .btn-add {
      background: var(--accent);
      color: #070d1e;
      border: none;
      font-weight: 700;
      padding: 9px 20px;
      cursor: pointer;
    }
    .file-upload-btn {
      background: #1e293b;
      color: var(--accent);
      border: 1px dashed var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .file-upload-btn:hover {
      background: #233554;
    }
    .subject-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .subject-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .subject-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subject-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .task-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
    }
    .task-card.status-done {
      opacity: 0.65;
      border-color: rgba(34, 197, 94, 0.4);
    }
    .task-card.status-in_progress {
      border-color: rgba(245, 158, 11, 0.6);
    }
    .task-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .task-title {
      flex: 1;
      font-size: 0.98rem;
      font-weight: 500;
    }
    .task-card.status-done .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .status-group {
      display: inline-flex;
      background: #111e33;
      padding: 3px;
      border-radius: 6px;
      gap: 3px;
    }
    .status-btn {
      background: transparent;
      border: none;
      padding: 4px 9px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .status-btn.todo.active {
      background: var(--todo);
      color: #fff;
    }
    .status-btn.in_progress.active {
      background: var(--in-prog);
      color: #000;
    }
    .status-btn.done.active {
      background: var(--done);
      color: #fff;
    }
    .btn-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
    }
    .btn-del:hover {
      color: var(--todo);
    }
    .comment-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .comment-row span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .comment-row input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 2px 0;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c722;
      border: 1px solid #0284c766;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      text-decoration: none;
      max-width: fit-content;
    }
    .file-badge:hover {
      background: #0284c744;
    }
    .file-del-btn {
      cursor: pointer;
      color: var(--todo);
      font-size: 0.8rem;
      margin-left: 4px;
    }
    .empty-week {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <aside>
    <h2>17 недель</h2>
    <div class="weeks-list" id="weeksNav"></div>
    <button class="btn-action" onclick="manageSubjects()">⚙️ Список предметов</button>
  </aside>

  <main>
    <header>
      <h1 id="currentWeekTitle">Неделя 1</h1>
      <div id="weekProgress" style="color: var(--text-muted);">Сдано: 0 из 0</div>
    </header>

    <div id="cloudStatus" class="status-msg">Подключение к облаку...</div>

    <!-- Форма добавления задачи -->
    <form class="task-form" id="newTaskForm">
      <div class="form-row">
        <!-- Выбор конкретной недели -->
        <select id="weekTargetSelect"></select>
        <select id="subjectSelect" required></select>
        <input type="text" id="titleInput" placeholder="Что нужно сделать (напр. Лаба №1)" required>
        <button type="submit" class="btn-add">+ Добавить</button>
      </div>

      <div class="form-subrow">
        <input type="text" id="commentInput" style="flex: 1;" placeholder="Заметка / замечание (напр. вариант 3, титульник переделать)">
        <label class="file-upload-btn">
          📎 Прикрепить файл
          <input type="file" id="taskFileInput" style="display:none;" onchange="handleFileSelect(event)">
        </label>
        <span id="chosenFileName" style="font-size: 0.82rem; color: var(--accent);"></span>
      </div>
    </form>

    <div id="subjectsContainer"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCUTvU7cawCVyAsFB0nHaY_eUHNAfIF84",
      authDomain: "things-to-do-about-study-6320f.firebaseapp.com",
      projectId: "things-to-do-about-study-6320f",
      storageBucket: "things-to-do-about-study-6320f.firebasestorage.app",
      messagingSenderId: "371907258824",
      appId: "1:371907258824:web:9766ab9fb62b029e51f8fd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "study_planner", "main_data");

    const TOTAL_WEEKS = 17;
    let activeWeek = 1;
    let attachedFile = null;

    let appState = {
      subjects: ["Математика", "Физика", "Информатика", "История"],
      tasks: {}
    };

    onSnapshot(docRef, (docSnap) => {
      document.getElementById('cloudStatus').innerText = "🟢 Облако синхронизировано";
      if (docSnap.exists()) {
        appState = docSnap.data();
      } else {
        saveToCloud();
      }
      renderWeeksOptions();
      renderSubjectsDropdown();
      renderNav();
      renderBlocks();
    }, (error) => {
      console.error(error);
      document.getElementById('cloudStatus').innerText = "⚠️ Ошибка связи с базой.";
    });

    async function saveToCloud() {
      try {
        await setDoc(docRef, appState);
      } catch (e) {
        console.error("Ошибка сохранения:", e);
      }
    }

    function renderWeeksOptions() {
      const select = document.getElementById('weekTargetSelect');
      select.innerHTML = '';
      for (let i = 1; i <= TOTAL_WEEKS; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Неделя ${i}`;
        if (i === activeWeek) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function renderSubjectsDropdown() {
      const select = document.getElementById('subjectSelect');
      select.innerHTML = '';
      (appState.subjects || []).forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.innerText = sub;
        select.appendChild(opt);
      });
    }

    function renderNav() {
      const nav = document.getElementById('weeksNav');
      nav.innerHTML = '';

      for (let i = 1; i <= TOTAL_WEEKS; i++) {
        const weekTasks = (appState.tasks && appState.tasks[i]) || [];
        const done = weekTasks.filter(t => t.status === 'done' || t.done === true).length;
        const total = weekTasks.length;

        const btn = document.createElement('button');
        btn.className = `week-btn ${i === activeWeek ? 'active' : ''}`;
        btn.onclick = () => {
          activeWeek = i;
          renderNav();
          renderBlocks();
          renderWeeksOptions();
        };

        btn.innerHTML = `
          <span>Неделя ${i}</span>
          ${total > 0 ? `<span class="badge">${done}/${total}</span>` : ''}
        `;
        nav.appendChild(btn);
      }
    }

    function renderBlocks() {
      document.getElementById('currentWeekTitle').innerText = `Неделя ${activeWeek}`;
      const container = document.getElementById('subjectsContainer');
      container.innerHTML = '';

      const tasks = (appState.tasks && appState.tasks[activeWeek]) || [];
      const totalDone = tasks.filter(t => t.status === 'done' || t.done === true).length;
      document.getElementById('weekProgress').innerText = `Сдано: ${totalDone} из ${tasks.length}`;

      if (tasks.length === 0) {
        container.innerHTML = '<div class="empty-week">На эту неделю ещё нет заданий. Добавь первое сверху!</div>';
        return;
      }

      // Группировка по предметам
      const grouped = {};
      tasks.forEach((task, origIndex) => {
        const sub = task.subject || 'Другое';
        if (!grouped[sub]) grouped[sub] = [];
        grouped[sub].push({ ...task, origIndex });
      });

      for (const [subjectName, items] of Object.entries(grouped)) {
        const block = document.createElement('div');
        block.className = 'subject-block';

        const blockDone = items.filter(t => t.status === 'done' || t.done === true).length;

        block.innerHTML = `
          <div class="subject-block-header">
            <span class="subject-title">📚 ${escapeHtml(subjectName)}</span>
            <span class="subject-counter">Сдано: ${blockDone} / ${items.length}</span>
          </div>
          <div class="task-items" id="items-${escapeHtml(subjectName)}"></div>
        `;

        const itemsContainer = block.querySelector('.task-items');

        items.forEach(task => {
          const status = task.status || (task.done ? 'done' : 'todo');
          const comment = task.comment || '';
          const i = task.origIndex;

          const card = document.createElement('div');
          card.className = `task-card status-${status}`;
          
          let fileHtml = '';
          if (task.file) {
            fileHtml = `
              <div style="display:flex; align-items:center; gap: 6px;">
                <a href="${task.file.data}" download="${task.file.name}" class="file-badge">
                  📎 Скачать: ${escapeHtml(task.file.name)}
                </a>
                <span class="file-del-btn" title="Удалить файл" onclick="removeFile(${i})">✕</span>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="task-main-row">
              <span class="task-title">${escapeHtml(task.title)}</span>
              
              <div class="status-group">
                <button class="status-btn todo ${status === 'todo' ? 'active' : ''}" 
                  onclick="changeStatus(${i}, 'todo')">Не сделано</button>
                <button class="status-btn in_progress ${status === 'in_progress' ? 'active' : ''}" 
                  onclick="changeStatus(${i}, 'in_progress')">Доделать</button>
                <button class="status-btn done ${status === 'done' ? 'active' : ''}" 
                  onclick="changeStatus(${i}, 'done')">Сдано</button>
              </div>

              <button class="btn-del" title="Удалить задачу" onclick="deleteTask(${i})">✕</button>
            </div>

            ${fileHtml}

            <div class="comment-row">
              <span>💬</span>
              <input type="text" value="${escapeHtml(comment)}" placeholder="Нажми, чтобы написать заметку..." 
                onchange="updateComment(${i}, this.value)" />
            </div>
          `;
          itemsContainer.appendChild(card);
        });

        container.appendChild(block);
      }
    }

    // Обработка выбора файла в форме
    window.handleFileSelect = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      // Ограничение ~800KB для Firestore documents (лимит 1MB на весь документ)
      if (file.size > 800 * 1024) {
        alert("Файл слишком большой. База данных поддерживает файлы до 800 КБ (методички, задания, docx, легкие pdf).");
        e.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        attachedFile = {
          name: file.name,
          data: evt.target.result
        };
        document.getElementById('chosenFileName').innerText = `✓ ${file.name}`;
      };
      reader.readAsDataURL(file);
    };

    // Добавление новой задачи
    document.getElementById('newTaskForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const targetWeek = parseInt(document.getElementById('weekTargetSelect').value);
      const subject = document.getElementById('subjectSelect').value;
      const title = document.getElementById('titleInput').value.trim();
      const comment = document.getElementById('commentInput').value.trim();

      if (!appState.tasks) appState.tasks = {};
      if (!appState.tasks[targetWeek]) appState.tasks[targetWeek] = [];

      appState.tasks[targetWeek].push({
        subject,
        title,
        status: 'todo',
        comment: comment,
        file: attachedFile || null
      });

      document.getElementById('titleInput').value = '';
      document.getElementById('commentInput').value = '';
      document.getElementById('taskFileInput').value = '';
      document.getElementById('chosenFileName').innerText = '';
      attachedFile = null;

      saveToCloud();
    });

    window.changeStatus = function(index, newStatus) {
      appState.tasks[activeWeek][index].status = newStatus;
      appState.tasks[activeWeek][index].done = (newStatus === 'done');
      saveToCloud();
    };

    window.updateComment = function(index, text) {
      appState.tasks[activeWeek][index].comment = text.trim();
      saveToCloud();
    };

    window.deleteTask = function(index) {
      appState.tasks[activeWeek].splice(index, 1);
      saveToCloud();
    };

    window.removeFile = function(index) {
      delete appState.tasks[activeWeek][index].file;
      saveToCloud();
    };

    window.manageSubjects = function() {
      const current = (appState.subjects || []).join(', ');
      const res = prompt("Список предметов через запятую:", current);
      if (res !== null) {
        appState.subjects = res.split(',').map(s => s.trim()).filter(Boolean);
        saveToCloud();
      }
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
