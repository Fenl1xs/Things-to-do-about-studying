<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учебный планер | 17 недель</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    aside {
      width: 250px;
      background: #111827;
      border-right: 1px solid var(--card-border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      position: sticky;
      top: 0;
    }
    aside h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 12px;
      padding-left: 8px;
    }
    .weeks-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }
    .week-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .week-btn:hover {
      background: var(--card);
      color: var(--text);
    }
    .week-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 12px;
    }
    .btn-action {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
    }
    .btn-action:hover {
      color: var(--text);
      background: #334155;
    }
    main {
      flex: 1;
      padding: 32px 40px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 14px;
    }
    .task-form {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: 190px 1fr auto;
      gap: 12px;
      margin-bottom: 24px;
    }
    input, select, button {
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    input, select {
      background: #0f172a;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .btn-add {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-weight: 600;
      padding: 10px 20px;
      cursor: pointer;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 14px 18px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .task-card.done {
      background: #1e293b66;
      opacity: 0.7;
    }
    .task-card.done .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--card-border);
      display: grid;
      place-content: center;
      cursor: pointer;
    }
    .task-card.done .custom-checkbox {
      background: var(--success);
      border-color: var(--success);
    }
    .custom-checkbox::after {
      content: "✓";
      color: #fff;
      font-size: 13px;
      display: none;
      font-weight: 700;
    }
    .task-card.done .custom-checkbox::after {
      display: block;
    }
    .subject-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .task-title {
      flex: 1;
    }
    .btn-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
    }
    .btn-del:hover {
      color: var(--danger);
    }
    .status-msg {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <aside>
    <h2>17 недель</h2>
    <div class="weeks-list" id="weeksNav"></div>
    <button class="btn-action" onclick="manageSubjects()">⚙️ Список предметов</button>
  </aside>

  <main>
    <header>
      <h1 id="currentWeekTitle">Неделя 1</h1>
      <div id="weekProgress" style="color: var(--text-muted);">Сдано: 0 из 0</div>
    </header>

    <div id="cloudStatus" class="status-msg">Подключение к облачной БД...</div>

    <form class="task-form" id="newTaskForm">
      <select id="subjectSelect" required></select>
      <input type="text" id="titleInput" placeholder="Что нужно сдать (напр. Лаба №1)" required>
      <button type="submit" class="btn-add">+ Добавить</button>
    </form>

    <div class="task-list" id="taskList"></div>
  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Ваши конфигурационные данные из Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCCUTvU7cawCVyAsFB0nHaY_eUHNAfIF84",
      authDomain: "things-to-do-about-study-6320f.firebaseapp.com",
      projectId: "things-to-do-about-study-6320f",
      storageBucket: "things-to-do-about-study-6320f.firebasestorage.app",
      messagingSenderId: "371907258824",
      appId: "1:371907258824:web:9766ab9fb62b029e51f8fd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "study_planner", "main_data");

    const TOTAL_WEEKS = 17;
    let activeWeek = 1;

    let appState = {
      subjects: ["Математика", "Физика", "Информатика", "История"],
      tasks: {}
    };

    // Подписка на изменения в базе реального времени
    onSnapshot(docRef, (docSnap) => {
      document.getElementById('cloudStatus').innerText = "🟢 Облако синхронизировано";
      if (docSnap.exists()) {
        appState = docSnap.data();
      } else {
        saveToCloud();
      }
      renderSubjects();
      renderNav();
      renderTasks();
    }, (error) => {
      console.error(error);
      document.getElementById('cloudStatus').innerText = "⚠️ Ошибка синхронизации с базой данных.";
    });

    async function saveToCloud() {
      try {
        await setDoc(docRef, appState);
      } catch (e) {
        console.error("Ошибка сохранения:", e);
      }
    }

    function renderSubjects() {
      const select = document.getElementById('subjectSelect');
      select.innerHTML = '';
      (appState.subjects || []).forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.innerText = sub;
        select.appendChild(opt);
      });
    }

    function renderNav() {
      const nav = document.getElementById('weeksNav');
      nav.innerHTML = '';

      for (let i = 1; i <= TOTAL_WEEKS; i++) {
        const weekTasks = (appState.tasks && appState.tasks[i]) || [];
        const done = weekTasks.filter(t => t.done).length;
        const total = weekTasks.length;

        const btn = document.createElement('button');
        btn.className = `week-btn ${i === activeWeek ? 'active' : ''}`;
        btn.onclick = () => {
          activeWeek = i;
          renderNav();
          renderTasks();
        };

        btn.innerHTML = `
          <span>Неделя ${i}</span>
          ${total > 0 ? `<span class="badge">${done}/${total}</span>` : ''}
        `;
        nav.appendChild(btn);
      }
    }

    function renderTasks() {
      document.getElementById('currentWeekTitle').innerText = `Неделя ${activeWeek}`;
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';

      const tasks = (appState.tasks && appState.tasks[activeWeek]) || [];
      const done = tasks.filter(t => t.done).length;
      document.getElementById('weekProgress').innerText = `Сдано: ${done} из ${tasks.length}`;

      if (tasks.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">На эту неделю пока нет задач.</div>';
        return;
      }

      tasks.forEach((task, index) => {
        const card = document.createElement('div');
        card.className = `task-card ${task.done ? 'done' : ''}`;
        card.innerHTML = `
          <div class="custom-checkbox" onclick="toggleTask(${index})"></div>
          <span class="subject-tag">${escapeHtml(task.subject)}</span>
          <span class="task-title">${escapeHtml(task.title)}</span>
          <button class="btn-del" onclick="deleteTask(${index})">✕</button>
        `;
        listEl.appendChild(card);
      });
    }

    document.getElementById('newTaskForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const subject = document.getElementById('subjectSelect').value;
      const title = document.getElementById('titleInput').value.trim();

      if (!appState.tasks) appState.tasks = {};
      if (!appState.tasks[activeWeek]) appState.tasks[activeWeek] = [];

      appState.tasks[activeWeek].push({ subject, title, done: false });
      document.getElementById('titleInput').value = '';
      saveToCloud();
    });

    window.toggleTask = function(index) {
      appState.tasks[activeWeek][index].done = !appState.tasks[activeWeek][index].done;
      saveToCloud();
    };

    window.deleteTask = function(index) {
      appState.tasks[activeWeek].splice(index, 1);
      saveToCloud();
    };

    window.manageSubjects = function() {
      const current = (appState.subjects || []).join(', ');
      const res = prompt("Список ваших предметов через запятую:", current);
      if (res !== null) {
        appState.subjects = res.split(',').map(s => s.trim()).filter(Boolean);
        saveToCloud();
      }
    };

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
